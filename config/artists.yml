# ------------------------------------------------------------
# Üç yerde kullanılır:
#   1. Günlük etkinlik taraması: Ticketmaster + Bandsintown'da her isim
#      sorgulanır, Münih/Bavyera'daki etkinlikler bildirilir.
#   2. Haber taraması: yerel basında isim geçerse aday olur.
#   3. Mekan sayfaları: Muffatwerk, Olympiahalle vb. listelerinde isim
#      geçerse aday olur.
#
# İŞARET KURALI — çok önemli:
#   "~İsim"  -> Türkçede günlük anlamı olan isimler (Duman = duman,
#               Ceza = ceza, Sıla, Elif, Model, Patron...). Sadece
#               metinde konser/tour/bilet gibi bir SAHNE bağlamı varsa
#               eşleşir. Yoksa her hava haberi "Duman" diye aday olur,
#               bildirim gürültüsü artar.
#   İşaretsiz -> tam isim olarak eşleşir (Tarkan, Sezen Aksu...).
#
# Yeni isim eklerken: bilinen yazımı kullan (Türkçe karakter dahil).
# İsim günlük dilde kelime mi? Evet ise başına "~" koy.
# ============================================================

