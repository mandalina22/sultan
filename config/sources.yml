# ============================================================
# KAYNAK LİSTESİ
# ------------------------------------------------------------
# type: rss   -> requests ile indirilip feedparser ile okunur
# type: html  -> requests + BeautifulSoup, link toplayıcı
# type: json  -> resmi JSON API; "parser" hangi API olduğunu söyler
#
# grup: <isim>      -> config/keywords.yml içindeki puanlama grubu
#                      (yerel / almanya_ulusal / bund / turkiye_medya /
#                       diaspora / mvg / etkinlik_avrupa / mekan / dernek)
# trusted: true     -> puanlama atlanır, her yeni içerik aday olur
# direct: true      -> aynısı + mesajda "resmi duyuru" diye etiketlenir
# otorite: N        -> bu kaynaktan gelen her içeriğe N puan eklenir.
#                      Güvenilir ve seçici yayın yapan kaynaklar için
#                      (Tagesschau, Bundesregierung). Kelimenin ağırlığı
#                      kadar KAYNAĞIN ağırlığı da önemli.
# url_fallback      -> ana URL ölürse sırayla denenir
# scan: news|events -> news saatte bir, events günde iki kez
#
# Üst üste 3 tur hata veren kaynak otomatik devre dışı kalır ve
# bir kez Telegram'a bildirilir. --test-sources hepsini tekrar dener.
# ============================================================

sources:
  # ==========================================================
  # 1) MÜNİH / BAVYERA YEREL BASINI
  # ==========================================================
  - name: "Merkur München"
    type: rss
    grup: yerel
    url: "https://www.merkur.de/lokales/muenchen/rssfeed.rdf"
    url_fallback: ["https://www.merkur.de/lokales/muenchen/rss"]

  - name: "Merkur Bayern"
    type: rss
    grup: yerel
    url: "https://www.merkur.de/bayern/rssfeed.rdf"

  - name: "tz München"
    type: rss
    grup: yerel
