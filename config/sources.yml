# ============================================================
# KAYNAK LİSTESİ
# ------------------------------------------------------------
# type: rss   -> requests ile indirilip feedparser ile okunur
# type: html  -> requests + BeautifulSoup, link toplayıcı
# type: json  -> resmi JSON API; "parser" hangi API olduğunu söyler
#
# grup: <isim>      -> config/keywords.yml içindeki puanlama grubu
#                      (yerel / almanya_ulusal / bund / turkiye_medya /
#                       diaspora / mvg / etkinlik_avrupa / mekan / dernek)
# trusted: true     -> puanlama atlanır, doğrudan LLM'e/gönderime gider
# direct: true      -> puanlama DA LLM DE atlanır, olduğu gibi gönderilir
#                      (zaten Türkçe ve resmi kaynaklar)
# url_fallback      -> ana URL ölürse sırayla denenir
# scan: news|events -> news saatte bir, events günde iki kez
#
# NOT: "# ?" işaretli kaynakların adresi doğrulanamadı; ilk kaynak
# sağlık testinde ölü çıkarsa düzeltilecek.
# ============================================================

sources:
  # ==========================================================
  # 1) MÜNİH / BAVYERA YEREL BASINI
  # ==========================================================
  - name: "Merkur München"
    type: rss
    grup: yerel
    url: "https://www.merkur.de/lokales/muenchen/rssfeed.rdf"
    url_fallback: ["https://www.merkur.de/lokales/muenchen/rss"]

  - name: "Merkur Bayern"
    type: rss
    grup: yerel
    url: "https://www.merkur.de/bayern/rssfeed.rdf"

  - name: "tz München"
    type: rss
    grup: yerel
    url: "https://www.tz.de/muenchen/rssfeed.rdf"

  - name: "Hallo München"                      # ?
    type: rss
    grup: yerel
    url: "https://www.hallo-muenchen.de/rssfeed.rdf"
    url_fallback: ["https://www.hallo-muenchen.de/muenchen/rssfeed.rdf"]

  - name: "Süddeutsche München"
    type: rss
    grup: yerel
    url: "https://rss.sueddeutsche.de/rss/Muenchen"

  - name: "Süddeutsche Bayern"                 # ?
    type: rss
    grup: yerel
    url: "https://rss.sueddeutsche.de/rss/Bayern"

  - name: "Abendzeitung München"
    type: rss
    grup: yerel
    url: "https://www.abendzeitung-muenchen.de/storage/rss/rss/muenchen-news-abendzeitung.xml"

  - name: "Abendzeitung Bayern"
    type: rss
    grup: yerel
    url: "https://www.abendzeitung-muenchen.de/storage/rss/rss/bayern-abendzeitung.xml"

  - name: "Abendzeitung Kultur"
    type: rss
    grup: yerel
    url: "https://www.abendzeitung-muenchen.de/storage/rss/rss/kultur-news-abendzeitung.xml"

  - name: "BR24"
    type: rss
    grup: yerel
    url: "https://www.br.de/nachrichten/meldungen/nachrichten-bayerischer-rundfunk100~newsRss.xml"

  - name: "Münchner Wochenanzeiger"            # ?
    type: rss
    grup: yerel
    url: "https://www.wochenanzeiger-muenchen.de/rss/muenchen.xml"
    url_fallback: ["https://www.wochenanzeiger-muenchen.de/rss"]

  - name: "Bundespolizei München"
    # Havalimanı, tren istasyonları, sınır — doğrulandı
    type: rss
    grup: yerel
    url: "https://www.presseportal.de/rss/dienststelle_64017.rss2"

  # ==========================================================
  # 2) MÜNİH RESMİ / ŞEHİR YÖNETİMİ
  # ==========================================================
  - name: "Rathaus Umschau"
    # Şehrin resmi günlük bülteni: Stadtrat kararları, KVR duyuruları
    type: html
    grup: yerel
    url: "https://ru.muenchen.de/"
    item_selector: "a"
    link_must_contain: "/20"
    min_text_len: 25

  - name: "Stadt München Aktuelles"            # ?
    type: html
    grup: yerel
    url: "https://stadt.muenchen.de/news.html"
    url_fallback: ["https://stadt.muenchen.de/infos/aktuelle-meldungen.html"]
    item_selector: "a"
    min_text_len: 25

  - name: "MVG Betriebsmeldungen (API)"
    # Resmi JSON API, anahtarsız — doğrulandı
    type: json
    parser: mvg
    grup: mvg
    url: "https://www.mvg.de/api/bgw-pt/v3/messages"

  - name: "NINA uyarılar — München Stadt (API)"
    # Bundesamt für Bevölkerungsschutz, Türkçe çeviri de geliyor — doğrulandı
    type: json
    parser: nina
    grup: mvg
    url: "https://warnung.bund.de/api31/dashboard/091620000000.json"
    direct: true

  - name: "NINA uyarılar — Landkreis München (API)"
    type: json
    parser: nina
    grup: mvg
    url: "https://warnung.bund.de/api31/dashboard/091840000000.json"
    direct: true

  # ==========================================================
  # 3) ALMANYA FEDERAL — "burada yaşayanı etkileyen" hattı
  # ==========================================================
