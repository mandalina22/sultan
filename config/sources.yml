    type: rss
    grup: diaspora
    url: "https://rss.dw.com/rdf/rss-tur-all"
    url_fallback: ["https://rss.dw.com/xml/rss-tur-all"]

  - name: "Euronews Türkçe"
    type: rss
    grup: diaspora
    url: "https://tr.euronews.com/rss"

  - name: "BBC Türkçe"                          # ?
    type: rss
    grup: diaspora
    url: "https://feeds.bbci.co.uk/turkce/rss.xml"

  # ==========================================================
  # 6) TÜRK RESMİ KURUMLARI
  # ==========================================================
  - name: "T.C. Münih Başkonsolosluğu"
    # Doğrulandı. direct: zaten Türkçe ve resmi, olduğu gibi gider.
    type: html
    grup: dernek
    url: "https://munih-bk.mfa.gov.tr/Mission"
    direct: true
    item_selector: "a"
    link_must_contain: "showannouncement"

  - name: "T.C. Dışişleri Bakanlığı Duyurular"  # ?
    type: html
    grup: diaspora
    url: "https://www.mfa.gov.tr/duyurular.tr.mfa"
    item_selector: "a"
    link_must_contain: "duyuru"

  - name: "T.C. Berlin Büyükelçiliği"           # ?
    type: html
