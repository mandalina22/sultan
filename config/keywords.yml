# ============================================================
# KELİME LİSTELERİ
# ------------------------------------------------------------
# EŞLEŞME KURALLARI (src/prefilter.py):
#   "=kelime"      -> TAM kelime eşleşmesi. Türkçede günlük anlamı olan
#                     sanatçı adları için ŞART ("duman", "ceza", "elif"...)
#   6+ harfli      -> düz alt-dize. "einbürgerung" kelimesi
#                     "Einbürgerungstest" ve "Masseneinbürgerung" içinde de
#                     eşleşir. Almanca birleşik kelime dili olduğu için
#                     bu davranış kasıtlı.
#   6'dan kısa     -> kelime başı + serbest ek. "türk" -> "Türken",
#                     "türkische", "türkischstämmig" hepsi eşleşir.
#
# BURASI GENİŞ OLMALI. Burada elenen haber bir daha geri gelmez;
# yanlış pozitifleri LLM (src/classifier.py) zaten eliyor.
# ============================================================

