      - "unterbrech"
      - "=streik"
      - "evakuier"
      - "polizeieinsatz"
      - "schienenersatz"
    negatif:
      - "fahrplanwechsel"
      - "haltestelle verlegt"

  # Etkinlik platformları (Avrupa geneli) — şehir filtresi şart
  etkinlik_avrupa:
    esik: 2
    # KAPI: gidilebilir bir şehir geçmiyorsa puanı ne olursa olsun elenir.
    # "Berlin'de Tarkan konseri" Münih'li için haber değil.
    zorunlu:
      - "münchen"
      - "muenchen"
      - "münih"
      - "nürnberg"
      - "augsburg"
      - "ingolstadt"
      - "regensburg"
      - "stuttgart"
      - "salzburg"

  # Alman mekan sayfaları: Türkçe etkinlik sinyali aranır
  mekan:
    esik: 1
    # KAPI: Alman mekan sayfasındaki her konser değil, sadece Türkçe
    # sinyali olan. Sanatçı listesi bu kapıya otomatik eklenir.
    zorunlu:
      - "türk"
      - "turkish"
      - "anadolu"
      - "istanbul"
      - "arabesk"
      - "oryantal"
      - "=gecesi"

  # Münih Türk dernek / cami siteleri: zaten bize göre,
  # sadece "yeni duyuru var mı" bakılır
  dernek:
