# ------------------------------------------------------------
# GRUPLARA ÖZEL AYAR
# Her kaynak sources.yml'de bir gruba bağlı. Grup:
#   esik    -> o grup için aday eşiği (varsayılan 3)
#   kesin / guclu / baglam / negatif -> ortağa EKLENİR
# ------------------------------------------------------------
gruplar:

  # Münih yerel basını.
  # Eşik 5, çünkü başlıkta geçen tek "güçlü" kelime 4 puan eder —
  # yani "Türkei" geçen her haber tek başına geçmesin, ikinci bir
  # sinyal (München, Konsulat, Einbürgerung…) gerekiyor.
  yerel:
    esik: 5

  # Alman ulusal medyası: Münih'ten uzak, eşik biraz yüksek
  almanya_ulusal:
    esik: 4

  # Bundesregierung / Bundestag / bakanlıklar.
  # Ölçüt "Türkiye ile ilgili mi" DEĞİL, "buradaki hayatı değiştirir mi".
  bund:
    esik: 3
    kesin:
      - "staatsangehörigkeit"
      - "migrationspaket"
      - "zuwanderungsgesetz"
      - "rückführung"
      - "arbeitsmigration"
    guclu:
      - "gesetzentwurf"
      - "kabinett"
      - "inkrafttreten"
      - "reform"
      - "erhöht sich"
      - "entlastung"

  # Türkiye ulusal medyası: her haber Türkiye ile ilgili,
  # o yüzden "türk/türkiye" burada puan getirmez, eşik yüksek.
  turkiye_medya:
    esik: 5
    kesin:
      - "almanya'da yaşayan"
      - "gurbetçilere"
      - "vize muafiyeti"
      - "vize krizi"
      - "schengen vizesi"
      - "yurt dışında yaşayan"
      - "avrupa'daki türkler"
      # Tarihi çapta olaylar tek başına yeter
      - "büyük deprem"
      - "şiddetli deprem"
      - "büyüklüğünde deprem"
      - "deprem meydana"
      - "=darbe"
      - "olağanüstü hal"
      - "orman yangın"
      - "sel felaket"
      - "milli yas"
    guclu:
      - "=seçim"
      - "referandum"
      - "dünya kupası"
      - "avrupa şampiyon"
      - "milli takım"
    negatif:
      - "=maç"
      - "süper lig"
      - "=dizi"
      - "=oyuncu"
      - "sosyal medya"

  # DW Türkçe, Euronews TR: Alman gündemini Türkçe veriyor.
  # En değerli kaynak, eşik düşük.
  diaspora:
    esik: 2
    kesin:
      - "almanya'da"
      - "münih'te"
      - "gurbetçi"

  # MVG API: sadece canı yakan olaylar
  mvg:
    esik: 2
    kesin:
