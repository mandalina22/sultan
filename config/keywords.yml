# ============================================================
# KELİME SÖZLÜĞÜ — AĞIRLIKLI PUANLAMA
# ------------------------------------------------------------
# Eski sistem: bir kelime eşleşti mi aday. Çok kaba, çok gürültülü.
# Yeni sistem: her kelimenin ağırlığı var, puanlar toplanır,
# eşiği geçen aday olur.
#
#   kesin   -> tek başına yeter, hemen aday (100 puan)
#   guclu   -> 2 puan
#   baglam  -> 1 puan
#   negatif -> 3 puan DÜŞÜRÜR (spor rutini, magazin, reklam)
#
# BAŞLIKTA geçen kelime 2 KATI sayılır; özette geçen tesadüf
# olabilir, başlıkta geçen olmaz.
#
# Varsayılan eşik 3. Yani:
#   "Türkei will EU-Beitritt"                 türkei(2)              = 2  ELENİR
#   "Türkei-Reisende: Regeln am Flughafen München"
#                                              türkei(2x2)+münchen(1) = 5  GEÇER
#   "Neue Einbürgerungstest-Fragen"           kesin                      GEÇER
#   "Bundesliga: Bayern gewinnt"              bayern(1)+bundesliga(-3)= -2 ELENİR
#
# EŞLEŞME KURALLARI (src/scoring.py):
#   "=kelime"  -> TAM kelime
#   "~kelime"  -> TAM kelime + metinde sahne bağlamı (konser/tour/bilet)
#                 Türkçede günlük anlamı olan sanatçı adları için
#   6+ harfli  -> düz alt-dize ("einbürgerung" -> "Einbürgerungstest")
#   daha kısa  -> kelime başı + serbest ek ("türk" -> "Türken", "türkisch")
# ============================================================

