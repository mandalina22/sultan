name: Haber ve gündem taraması

on:
  schedule:
    # Saatte bir, :07'de (tam saatte GitHub'ın kuyruğu dolu olur, gecikir).
    # Haber, resmi duyuru, MVG/NINA uyarıları — etkinlikler burada DEĞİL,
    # onlar events.yml'de günde iki kez taranır.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sadece dene, Telegram'a gönderme"
        type: boolean
        default: false

permissions:
  contents: write

# Aynı anda iki tarama çalışırsa seen.json çakışır — sıraya sokuyoruz.
concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  tara:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m src.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Hafızayı (seen.json) geri yaz
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name  "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet && echo "değişiklik yok" && exit 0
          git commit -m "radar: hafıza güncellendi [skip ci]"
          # Bu sırada başka bir run push etmiş olabilir
          for i in 1 2 3; do
            git pull --rebase --autostash origin ${{ github.ref_name }} && \
            git push && exit 0
            sleep 5
          done
          echo "::warning::seen.json push edilemedi"
