name: Kaynak sağlık testi

# Feed adresleri zamanla değişir ve site yeniden tasarlanır. Bu iş
# haftada bir tüm kaynakları yoklar ve ölenlerin listesini Telegram'a
# düşürür — bot sessizce körleşmesin diye.

on:
  schedule:
    - cron: "0 6 * * 1"   # her pazartesi 06:00 UTC
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Haber kaynakları
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m src.main --test-sources

      - name: Etkinlik kaynakları
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: python -m src.main --events --test-sources
